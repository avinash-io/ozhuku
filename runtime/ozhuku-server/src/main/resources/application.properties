spring.application.name=ozhuku-server

ozhuku.storageRoot=./workspace

spring.datasource.url=jdbc:postgresql://localhost:5432/ozhuku
spring.datasource.username=ozhuku
spring.datasource.password=ozhuku-local
spring.datasource.driver-class-name=org.postgresql.Driver

management.endpoints.web.exposure.include=health,info,liveness,readiness,conditions,configprops,metrics,loggers,mappings,auditevents
management.endpoint.health.show-details=always
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Health groups: liveness checks only the app, readiness includes database
management.endpoint.health.group.liveness.show-details=always
management.endpoint.health.group.readiness.show-details=always