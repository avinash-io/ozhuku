services:

  postgres:
    image: postgres:17-alpine
    container_name: ozhuku-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ozhuku
      POSTGRES_USER: ozhuku
      POSTGRES_PASSWORD: ozhuku-local

    ports:
      - "5432:5432"

    volumes:
      - ozhuku-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ozhuku -d ozhuku"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ozhuku-postgres-data: